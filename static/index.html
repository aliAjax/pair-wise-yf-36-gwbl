<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>生物样本库知情同意与撤回</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #1f2937; }
    main { max-width: 960px; margin: auto; }
    pre { background: #f3f4f6; padding: 1rem; border-radius: 8px; overflow-x: auto; }
    button { padding: .5rem .8rem; cursor: pointer; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { border: 1px solid #d1d5db; padding: .5rem .6rem; text-align: left; font-size: .9rem; }
    th { background: #f9fafb; }
    .badge { display: inline-block; padding: .1rem .5rem; border-radius: 999px; font-size: .75rem; }
    .badge-ok { background: #dcfce7; color: #166534; }
    .badge-restricted { background: #fee2e2; color: #991b1b; }
    .muted { color: #6b7280; }
  </style>
</head>
<body>
<main>
  <h1>生物样本库知情同意与撤回</h1>
  <p>新版本同意生效后，旧同意下存的样本会按新范围重算可用范围；未覆盖的用途标为受限，借出和匿名化都会停下，并能在下方看出受限依据的同意版本。</p>
  <p>
    <button onclick="checkHealth()">检查服务状态</button>
    <button onclick="loadDashboard()">刷新样本与同意</button>
  </p>
  <pre id="result">等待操作</pre>

  <h2>样本</h2>
  <div id="samples"></div>

  <h2>同意版本</h2>
  <div id="consents"></div>

  <h2>常用接口</h2>
  <pre>GET  /health
GET  /api/&lt;kind&gt;
POST /api/&lt;kind&gt;
GET  /api/entities/&lt;id&gt;
POST /api/entities/&lt;id&gt;/actions
POST /api/batches/store
GET  /api/samples?restricted=true</pre>
</main>
<script>
async function checkHealth() {
  const response = await fetch('/health');
  document.getElementById('result').textContent = JSON.stringify(await response.json(), null, 2);
}

function badge(text, ok) {
  return '<span class="badge ' + (ok ? 'badge-ok' : 'badge-restricted') + '">' + text + '</span>';
}

async function loadDashboard() {
  const [samplesRes, consentsRes] = await Promise.all([
    fetch('/api/samples'),
    fetch('/api/consents')
  ]);
  const samples = (await samplesRes.json()).items || [];
  const consents = (await consentsRes.json()).items || [];

  const sampleRows = samples.map(s => {
    const d = s.data || {};
    const restricted = !!d.restricted;
    const basis = restricted
      ? '受限依据：同意版本 ' + (d.restricted_by_consent_version || '?')
      : '可用范围：' + (d.scope || []).join('、');
    return '<tr>' +
      '<td>' + (d.sample_code || s.id) + '</td>' +
      '<td>' + s.status + '</td>' +
      '<td>' + (d.consent_version || '<span class="muted">—</span>') + '</td>' +
      '<td>' + (restricted ? badge('受限', false) : badge('正常', true)) + '</td>' +
      '<td>' + (restricted ? (d.restricted_uses || []).join('、') : '<span class="muted">—</span>') + '</td>' +
      '<td>' + basis + '</td>' +
      '</tr>';
  }).join('');
  document.getElementById('samples').innerHTML =
    '<table><thead><tr><th>样本编号</th><th>状态</th><th>入库同意版本</th><th>受限标记</th><th>受限用途</th><th>依据 / 范围</th></tr></thead>' +
    '<tbody>' + (sampleRows || '<tr><td colspan="6" class="muted">暂无样本</td></tr>') + '</tbody></table>';

  const consentRows = consents.map(c => {
    const d = c.data || {};
    return '<tr>' +
      '<td>' + (d.version || '<span class="muted">—</span>') + '</td>' +
      '<td>' + (d.participant_id || '') + '</td>' +
      '<td>' + (d.scope || []).join('、') + '</td>' +
      '<td>' + c.status + '</td>' +
      '<td>' + c.version + '</td>' +
      '</tr>';
  }).join('');
  document.getElementById('consents').innerHTML =
    '<table><thead><tr><th>同意版本</th><th>参与者</th><th>范围</th><th>状态</th><th>记录版本</th></tr></thead>' +
    '<tbody>' + (consentRows || '<tr><td colspan="5" class="muted">暂无同意</td></tr>') + '</tbody></table>';
}
</script>
</body>
</html>
